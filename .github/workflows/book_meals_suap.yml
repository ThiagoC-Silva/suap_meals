name: Agendar refeições no SUAP
on:
  schedule:
    - cron: '30 * * * 0,3' 
  workflow_dispatch: 

jobs:
  suap_meals_script:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
      # Condição para rodar o script somente no horário de 21h30
      if: format('{0:H}', utcNow()) == secrets.CRON_SCHEDULING
      env:
        SUAP_USERNAME: ${{ secrets.SUAP_USERNAME }}
        SUAP_PASSWORD: ${{ secrets.SUAP_PASSWORD }}
      run: |
        python -m suap_meals.main